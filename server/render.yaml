# Import this blueprint from the repository root path server/render.yaml.
# Free instance: expect cold starts and free-tier quotas. No paid AI service is used.
services:
  - type: web
    name: lexical-trove-api
    runtime: node
    plan: free
    buildCommand: node --version
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: ALLOWED_ORIGIN
        value: https://selfsufficient717-creator.github.io
      - key: GEMINI_FREE_TIER
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
